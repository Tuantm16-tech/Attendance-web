<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kiểm tra kết nối Apps Script</title>
<style>
  body { font-family: system-ui, "Segoe UI", Roboto, sans-serif; margin:0; padding:20px; background:#f3f5f4; color:#1b2421; }
  main { max-width:760px; margin:0 auto; }
  h1 { font-size:1.4rem; }
  input { width:100%; padding:14px; font-size:1rem; border:1px solid #c9d1ce; border-radius:10px; }
  button { margin-top:12px; padding:16px 24px; font-size:1.1rem; font-weight:700; color:#fff; background:#1f7a5a; border:0; border-radius:12px; }
  pre { white-space:pre-wrap; word-break:break-all; background:#fff; padding:14px; border-radius:10px; border:1px solid #d5dbd8; font-size:.95rem; }
  .ok { color:#1f7a5a; font-weight:700; } .bad { color:#b5532a; font-weight:700; }
</style>
</head>
<body>
<main>
  <h1>Kiểm tra kết nối tới Apps Script</h1>
  <p>Dán URL Web app (kết thúc bằng <b>/exec</b>) rồi bấm Kiểm tra. Mở trang này <b>ngay trên tablet</b>.</p>
  <input id="url" placeholder="https://script.google.com/macros/s/.../exec" autocomplete="off" autocapitalize="off" spellcheck="false">
  <button id="go">Kiểm tra</button>
  <pre id="out">Chưa chạy.</pre>
</main>
<script>
const out = document.getElementById('out');
const log = (t, cls) => { out.innerHTML += '\n' + (cls ? `<span class="${cls}">${t}</span>` : t); };
const esc = s => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

document.getElementById('go').onclick = async () => {
  const url = document.getElementById('url').value.trim();
  out.textContent = '';
  log('URL: ' + esc(url));

  // 1) Kiểm tra hình thức URL
  const problems = [];
  if (!/^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec$/.test(url)) {
    problems.push('URL không đúng dạng https://script.google.com/macros/s/<ID>/exec');
  }
  if (/\/dev$/.test(url)) problems.push('Đây là URL /dev (chỉ chạy được với chủ sở hữu), cần URL /exec');
  if (/\/home\/|\/edit/.test(url)) problems.push('Đây là URL trình soạn thảo, không phải URL Web app');
  if (/\s/.test(url) || /DÁN_URL/.test(url)) problems.push('URL chứa khoảng trắng hoặc vẫn là chữ mẫu');
  if (problems.length) { problems.forEach(p => log('✗ ' + p, 'bad')); }
  else log('✓ Hình thức URL hợp lệ', 'ok');

  // 2) Có kết nối mạng tới Google không (không cần CORS)
  let reachable = false;
  try { await fetch(url, { mode: 'no-cors' }); reachable = true; log('✓ Tablet kết nối được tới script.google.com', 'ok'); }
  catch (e) { log('✗ Tablet KHÔNG kết nối được tới URL này: ' + esc(e.message), 'bad'); }

  // 3) Gọi thật như trang điểm danh
  let res, text;
  try {
    res = await fetch(url);
    text = await res.text();
    log(`✓ Gọi dữ liệu được (HTTP ${res.status}, loại: ${esc(res.headers.get('content-type') || 'không rõ')})`, 'ok');
  } catch (e) {
    log('✗ Gọi dữ liệu thất bại (CORS/quyền): ' + esc(e.message), 'bad');
    log('\n=== KẾT LUẬN ===');
    if (!reachable) {
      log('Tablet không tới được URL: kiểm tra lại URL đã dán, mạng Wi-Fi của tablet (có thể mạng công ty chặn script.google.com).', 'bad');
    } else {
      log('Tới được Google nhưng bị chặn khi trang web gọi. Nguyên nhân gần như chắc chắn là một trong các điều sau:\n' +
          '1) "Who has access" chưa là Anyone (hoặc tài khoản công ty không cho chọn Anyone)\n' +
          '2) Deployment chưa được Deploy "New version" bằng code API mới\n' +
          '3) URL đang trỏ tới deployment cũ (bản HtmlService)\n' +
          '4) doGet bị lỗi trước khi chạy (cần Run doGet và Allow quyền Sheets).', 'bad');
    }
    return;
  }

  // 4) Đọc nội dung
  log('\nNội dung nhận được (300 ký tự đầu):');
  log(esc(text.slice(0, 300)));
  log('\n=== KẾT LUẬN ===');
  let data;
  try { data = JSON.parse(text); } catch (e) { data = null; }
  if (Array.isArray(data)) {
    log(`Backend HOẠT ĐỘNG TỐT: nhận được ${data.length} nhân viên.\nNếu trang điểm danh vẫn báo lỗi thì URL trong API_URL của index.html trên GitHub khác với URL vừa test, hoặc Chrome đang giữ bản cũ của trang.`, 'ok');
  } else if (data && data.ok === false) {
    log('Backend chạy nhưng báo lỗi: ' + esc(data.error), 'bad');
  } else {
    log('URL trả về trang web (HTML) chứ không phải dữ liệu JSON: deployment đang chạy bản HtmlService cũ hoặc là trang lỗi. Hãy dán Code.gs bản API và Deploy New version.', 'bad');
  }
};
</script>
</body>
</html>
